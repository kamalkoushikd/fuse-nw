name: Release

# Publishes the protocol core when a version tag is pushed:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Attaches a self-contained tarball plus install.sh to the GitHub release, so
# users can install with:
#
#     curl -fsSL https://github.com/OWNER/REPO/releases/latest/download/install.sh | sh
#
# This is protocol-only (fuse::proto / fuse::fuse). The ergonomic SDK has its
# own release, from the fuse-sdk repo.
#
# Can also be run manually from the Actions tab to test the packaging.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the protocol core tarball
        run: ./scripts/make_release.sh "${{ steps.ver.outputs.version }}"

      # Prove the artifact works before publishing it: install into a scratch
      # prefix, then compile and run a tiny program against fuse::proto's
      # public wire-encoding helpers through that install (round-trips a
      # value through put_u16/get_u16, the smallest real proof the headers
      # and libfuse_proto.so agree with each other).
      - name: Verify the tarball installs and works
        run: |
          set -e
          V=${{ steps.ver.outputs.version }}
          PFX="$RUNNER_TEMP/fuse-verify"
          ./scripts/install.sh --tarball "dist/fuse-nw-${V}-linux-x86_64.tar.gz" --prefix "$PFX"
          export PKG_CONFIG_PATH="$PFX/lib/pkgconfig"

          cat > "$RUNNER_TEMP/smoke.cpp" <<'EOF'
          #include <cassert>
          #include <cstdint>
          #include "fuse/proto/wire.hpp"
          int main() {
              uint8_t buf[2];
              fuse::proto::put_u16(buf, 0xBEEF);
              uint16_t v = 0;
              fuse::proto::get_u16(buf, &v);
              assert(v == 0xBEEF);
              return 0;
          }
          EOF
          g++ -std=c++17 "$RUNNER_TEMP/smoke.cpp" -o "$RUNNER_TEMP/smoke" $(pkg-config --cflags --libs fuse)
          "$RUNNER_TEMP/smoke"
          echo "smoke test passed"

      # A versionless copy so `releases/latest/download/...` has a stable name.
      - name: Add a stable-name copy
        run: |
          V=${{ steps.ver.outputs.version }}
          cp "dist/fuse-nw-${V}-linux-x86_64.tar.gz" dist/fuse-nw-linux-x86_64.tar.gz
          ( cd dist && sha256sum fuse-nw-linux-x86_64.tar.gz > fuse-nw-linux-x86_64.tar.gz.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: fuse-nw
          path: dist/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh
            ```

            Installs to `/usr/local` as root, `~/.local` otherwise. Adding
            `--prefix DIR` puts it anywhere; `--uninstall` removes it.

            Ships the protocol core (`fuse::proto`, the older `fuse::fuse` C
            scaffold), headers, and CMake/pkg-config support.

            ```cmake
            find_package(fuse CONFIG REQUIRED)
            target_link_libraries(your_target PRIVATE fuse::proto)
            ```

            Want the ergonomic send/recv API instead (C or Python)? See
            [fuse-sdk](https://github.com/kamalkoushikd/fuse-sdk), which has
            its own release built on top of this one.

            See [docs/USAGE.md](https://github.com/${{ github.repository }}/blob/main/docs/USAGE.md).
