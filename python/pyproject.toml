[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fuse-transport"
version = "0.1.0"
description = "Socket-style Python bindings for the Fuse UDP transport protocol"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["networking", "transport", "udp", "protocol", "sockets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]

# No install_requires: the bindings are pure ctypes. They do need the Fuse
# shared library present, which the SDK installer provides.

[project.urls]
Homepage = "https://github.com/kamalkoushikd/fuse-nw"
Documentation = "https://github.com/kamalkoushikd/fuse-nw/blob/main/docs/SDK.md"

[tool.setuptools]
packages = ["fuse"]
